name: Frontend CI

on:
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 供应链审计：只审**生产依赖**（--omit=dev）。
      # 开发依赖的告警（vite / esbuild 的开发服务器问题）不随产物上线，故不纳入门禁，
      # 升级它们需要跨多个大版本（见 docs/开发计划.md 的 R-03 说明）。
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check i18n key parity
        run: npm run i18n:check

      # 单元测试放在 build 之前：类型错误 / 逻辑回归在这里就能拦下，不必等一次完整构建。
      # 用 test:coverage（而非 test）是为了同时卡住核心模块的覆盖率阈值。
      - name: Unit tests
        run: npm run test:coverage

      - name: Type check & build
        run: npm run build
